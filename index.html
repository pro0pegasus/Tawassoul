<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tawassol - Gestionnaire des participants</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header-container">
        <div class="">
            <a href="#">
            Tawassol
            </a>
        </div> 
    </header>

    <main>
        <h1>Gestionnaire des participants</h1>
        
        <div class="participants">
            <p>Participants Total: <span id="total-participants">0</span></p>
            <p>Participants sélectionnés: <span id="selected-participants">0</span></p>
        </div>

        <div class="form-container">
            <form id="participants-form">
                <label for="nom">Nom complet:</label>
                <input type="text" name="nom" id="nom" placeholder="Yassine Borak" required>
                <span class="span-error" id="nom-error"></span>

                <label for="formation">Formation:</label>
                <select id="formation" required>
                    <option selected disabled>Choisir une formation...</option>
                    <option value="bureau">Bureautique</option>
                    <option value="web">Web</option>
                    <option value="lang">Langues</option>
                </select>

                <label for="email">Email:</label>
                <input type="email" name="email" id="email" placeholder="yassineborak@gmail.com" required>
                <span class="span-error" id="email-error"></span>
                
                <div class="submit-btn">
                    <button type="submit">Ajouter</button>
                </div>

            </form>
        </div>
       
        <section class="recherche">

            <div class="filter-container">
                <label for="filter">Recherche</label>
                <input id="filter" type="text" name="filter" placeholder="Yassine..."> 
            </div>

            <div class="filter-btns">
                <button data-formation="bureau" type="button">Bureautique</button>
                <button data-formation="web" type="button">Web</button>
                <button data-formation="lang" type="button">Langues</button>
            </div>
            
        </section>

        <section class="participants-list">
            <p>Participants:</p>
            <ul id="liste"></ul>
            <div class="supp-container">
                <button id="delete-selected">Supprimer sélection</button>
            </div>
        </section>

    </main>

    <footer>
        <p>Tawassol - Projet pédagogique</p>
    </footer>
    <script src="./script.js" defer></script>
</body>
</html>
